<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Khaim · Sistema de Ejecución</title>
    <meta name="description" content="Sistema personal de hábitos, disciplina y progreso diario de Khaim. Funciona sin servidor y guarda todo en tu navegador." />
    <meta name="theme-color" content="#08080c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">K</span>
        <div class="brand-text">
          <strong>Sistema de Ejecución</strong>
          <span id="topbar-date">—</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="clock" id="clock">--:--</div>
        <div class="ring" id="topbar-ring" style="--p:0">
          <span id="topbar-pct">0%</span>
        </div>
      </div>
    </header>

    <nav class="sidenav" id="sidenav"></nav>

    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tabbar" id="tabbar"></nav>

    <div class="modal-root" id="modal-root" hidden></div>
    <div class="toast-root" id="toast-root" aria-live="polite"></div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
