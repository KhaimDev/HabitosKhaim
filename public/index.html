<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Villa</title>
    <meta name="description" content="Sistema personal de Villa." />
    <meta name="theme-color" content="#050509" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <section class="access-screen" id="access-screen" aria-label="Acceso personal">
      <video class="access-video" autoplay muted loop playsinline preload="metadata" aria-hidden="true">
        <source src="./assets/console-bg.mp4" type="video/mp4" />
      </video>
      <div class="video-shade" aria-hidden="true"></div>
      <div class="aurora aurora-a" aria-hidden="true"></div>
      <div class="aurora aurora-b" aria-hidden="true"></div>
      <div class="access-name">VILLA</div>
      <div class="access-status" id="access-status">INICIANDO SISTEMA PERSONAL</div>
      <div class="access-copy">
        <p id="access-message">SOLICITANDO ACCESO</p>
      </div>
      <button class="fingerprint" id="fingerprint" aria-label="Solicitar acceso">
        <span class="fingerprint-rings" aria-hidden="true"></span>
        <img src="./assets/fingerprint.png" alt="" />
      </button>
      <div class="access-footer"><span>ESTADO: VULNERABLE</span></div>
    </section>

    <main id="app-shell" class="app-shell" hidden>
      <header class="app-header" id="app-header"></header>
      <main id="view" class="view" tabindex="-1"></main>
      <nav class="tabbar" id="tabbar"></nav>
    </main>

    <div class="modal-root" id="modal-root" hidden></div>
    <div class="toast-root" id="toast-root" aria-live="polite"></div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
